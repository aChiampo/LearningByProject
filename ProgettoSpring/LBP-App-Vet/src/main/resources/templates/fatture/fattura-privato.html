<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      font-size: 13px;
    }

    .page {
      padding: 32px;
    }

    .header {
      border-bottom: 2px solid #1f2937;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .section {
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    th {
      background-color: #f3f4f6;
    }

    .total {
      text-align: right;
      font-size: 18px;
      font-weight: bold;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>Fattura</h1>
      <p>
        Numero pagamento:
        <strong th:text="${pagamento.id}"></strong>
      </p>
      <p>
        Data:
        <strong th:text="${pagamento.data}"></strong>
      </p>
    </div>

    <div class="section">
      <h2>Cliente</h2>
      <p>
        <strong th:text="${pagamento.utente.nome}"></strong>
        <strong th:text="${pagamento.utente.cognome}"></strong>
      </p>
      <p th:if="${pagamento.utente.email != null}">
        Email:
        <span th:text="${pagamento.utente.email}"></span>
      </p>
      <p th:if="${pagamento.utente.telefono != null}">
        Telefono:
        <span th:text="${pagamento.utente.telefono}"></span>
      </p>
      <p th:if="${pagamento.utente.indirizzo != null || pagamento.utente.citta != null}">
        Indirizzo:
        <span th:text="${pagamento.utente.indirizzo}"></span>
        <span th:text="${pagamento.utente.citta}"></span>
      </p>
      <p th:if="${pagamento.utente.codiceFiscale != null}">
        Codice fiscale:
        <span th:text="${pagamento.utente.codiceFiscale}"></span>
      </p>
    </div>

    <div class="section">
      <h2>Dettaglio prestazione</h2>
      <table>
        <thead>
          <tr>
            <th>Descrizione</th>
            <th>Animale</th>
            <th>Veterinario</th>
            <th>Importo</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${visita != null}">
            <td th:text="${visita.tipoVisita.nome}"></td>
            <td th:text="${visita.animale.nome}"></td>
            <td>
              <span th:text="${visita.veterinario.nome}"></span>
              <span th:text="${visita.veterinario.cognome}"></span>
            </td>
            <td th:text="${visita.tipoVisita.prezzo}"></td>
          </tr>
          <tr th:if="${visita == null}">
            <td>Pagamento</td>
            <td></td>
            <td></td>
            <td th:text="${pagamento.importoTotale}"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <p>
        Tipo pagamento:
        <strong th:text="${pagamento.tipoPagamento}"></strong>
      </p>
    </div>

    <div class="total">
      Totale:
      <span th:text="${pagamento.importoTotale}"></span>
    </div>
  </div>
</body>
</html>
