<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <table width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f6f8; padding:24px 0;">
        <tr>
            <td align="center">
                <table width="600" cellspacing="0" cellpadding="0"
                    style="width:600px; max-width:100%; background-color:#ffffff; border:1px solid #e5e7eb;">
                    <tr>
                        <td style="padding:24px 28px; background-color:#2563eb; color:#ffffff;">
                            <h1 style="margin:0; font-size:24px; line-height:1.3;">Richiesta appuntamento ricevuta</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px;">
                            <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">
                                Ciao <strong th:text="${clientName}"></strong>,
                            </p>
                            <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">
                                abbiamo ricevuto la tua richiesta di prima visita per <strong
                                    th:text="${petName}"></strong>.
                                Lo studio ti ricontatter&agrave; al pi&ugrave; presto per concordare il momento
                                pi&ugrave; adatto.
                            </p>
                            <table width="100%" cellspacing="0" cellpadding="0"
                                style="margin:20px 0; border:1px solid #e5e7eb;">
                                <tr>
                                    <td
                                        style="padding:10px 12px; background-color:#f9fafb; font-weight:bold; width:40%;">
                                        Nome e cognome</td>
                                    <td style="padding:10px 12px;" th:text="${clientName}"></td>
                                </tr>
                                <tr>
                                    <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Email
                                    </td>
                                    <td style="padding:10px 12px;" th:text="${email}"></td>
                                </tr>
                                <tr>
                                    <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Telefono
                                    </td>
                                    <td style="padding:10px 12px;" th:text="${phone}"></td>
                                </tr>
                                <tr>
                                    <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Nome
                                        dell'animale</td>
                                    <td style="padding:10px 12px;" th:text="${petName}"></td>
                                </tr>
                                <tr>
                                    <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Animale
                                    </td>
                                    <td style="padding:10px 12px;" th:text="${animalType}"></td>
                                </tr>
                                <tr>
                                    <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Motivo
                                        della visita</td>
                                    <td style="padding:10px 12px;" th:text="${visitReason}"></td>
                                </tr>
                                <tr th:if="${notes != null and !notes.isEmpty()}">
                                    <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">
                                        Informazioni utili</td>
                                    <td style="padding:10px 12px;" th:text="${notes}"></td>
                                </tr>
                            </table>
                            <p style="margin:0; font-size:16px; line-height:1.5;">
                                Grazie per aver scelto <strong th:text="${clinicName}"></strong>.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
