<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <table width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f6f8; padding:24px 0;">
    <tr>
      <td align="center">
        <table width="600" cellspacing="0" cellpadding="0" style="width:600px; max-width:100%; background-color:#ffffff; border:1px solid #e5e7eb;">
          <tr>
            <td style="padding:24px 28px; background-color:#b91c1c; color:#ffffff;">
              <h1 style="margin:0; font-size:24px; line-height:1.3;">Appuntamento cancellato</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">
                Ciao <strong th:text="${clientName}"></strong>,
              </p>
              <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">
                ti confermiamo che l'appuntamento per <strong th:text="${animalName}"></strong> &egrave; stato cancellato.
              </p>
              <table width="100%" cellspacing="0" cellpadding="0" style="margin:20px 0; border:1px solid #e5e7eb;">
                <tr>
                  <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Data e ora</td>
                  <td style="padding:10px 12px;" th:text="${appointmentDateTime}"></td>
                </tr>
                <tr th:if="${cancellationReason != null}">
                  <td style="padding:10px 12px; background-color:#f9fafb; font-weight:bold;">Motivo</td>
                  <td style="padding:10px 12px;" th:text="${cancellationReason}"></td>
                </tr>
              </table>
              <p style="margin:0; font-size:16px; line-height:1.5;">
                Puoi prenotare un nuovo appuntamento dalla tua area personale o contattando la clinica.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px; background-color:#f9fafb; color:#6b7280; font-size:13px; line-height:1.5;">
              <p style="margin:0;" th:text="${clinicName}"></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
